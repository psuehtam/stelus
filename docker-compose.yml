services:
  caddy:
    image: caddy:2-alpine
    container_name: stelus-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-stelusbordados.com.br}
      SISTEMA_DOMAIN: ${SISTEMA_DOMAIN:-sistema.stelusbordados.com.br}
      ACME_EMAIL: ${ACME_EMAIL:-estelusbordados@gmail.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
      - sistema-frontend

  site:
    build:
      context: ./site
      args:
        SITE_URL: ${SITE_URL:-https://stelusbordados.com.br}
    container_name: stelus-site
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://stelusbordados.com.br}
    expose:
      - '3000'

  sistema-frontend:
    build:
      context: ./sistema/frontend
      args:
        API_URL: ${API_URL:-http://backend:4000}
    container_name: stelus-sistema-frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://backend:4000}
    expose:
      - '3000'
    depends_on:
      - backend

  backend:
    build: ./sistema/backend
    container_name: stelus-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@database:3306/${MYSQL_DATABASE:-stelus_bordados}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL:-https://sistema.stelusbordados.com.br}
    volumes:
      - backend_generated:/app/generated
      - backend_uploads:/app/uploads
    expose:
      - '4000'
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: stelus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stelus_bordados}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sistema/database/setup.docker.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  backend_generated:
  backend_uploads:
  caddy_data:
  caddy_config:
